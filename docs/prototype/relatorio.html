<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Relatório · Loja Atlântico — Marketing Hub</title>
<link rel="stylesheet" href="assets/styles.css" />
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
  .page { max-width: none; padding: 0; }
  .editor { display: grid; grid-template-columns: 270px minmax(0, 1fr) 300px; min-height: calc(100vh - 118px); }
  .outline { border-right: 1px solid var(--border); padding: 14px 10px; background: var(--bg); }
  .outline h5 { margin: 14px 8px 4px; font-size: 11px; font-weight: 500; color: var(--fg-3); display: flex; justify-content: space-between; }
  .sec { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: var(--radius); color: var(--fg-2); }
  .sec:hover { background: var(--hover); }
  .sec.on { background: var(--surface); border: 1px solid var(--border); color: var(--fg); }
  .sec .g { color: var(--fg-4); display: inline-flex; }
  .sec .tick { width: 14px; height: 14px; border-radius: 3px; background: var(--fg); color: #fff; display: grid; place-items: center; margin-left: auto; flex: none; }
  .sec .tick.off { background: transparent; border: 1.5px solid var(--border-strong); }
  .canvas { background: #ececef; padding: 24px; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .sheet { width: 820px; background: #fff; border: 1px solid var(--border); padding: 44px 52px 36px; position: relative; }
  .sheet .foot { position: absolute; bottom: 14px; left: 52px; right: 52px; display: flex; justify-content: space-between; font-size: 10px; color: var(--fg-3); }
  .sheet h2 { font-size: 17px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sheet h4 { font-size: 12px; margin: 22px 0 8px; font-weight: 600; }
  .sheet p { margin: 0; color: var(--fg-2); line-height: 1.55; }
  .rt th, .rt td { padding: 6px 10px; font-size: 12px; }
  .rt th { background: transparent; border-bottom: 1px solid var(--fg); color: var(--fg-2); }
  .rt tr.grp td { padding-top: 12px; font-weight: 600; font-size: 11px; color: var(--fg-3); border-bottom: 1px solid var(--border); background: transparent; }
  .rt tbody tr:hover td { background: transparent; }
  .rt td.src { color: var(--fg-4); font-size: 10.5px; }
  .settings { border-left: 1px solid var(--border); background: var(--surface); padding: 0; }
  .set-b { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .set-b h5 { margin: 0 0 10px; font-size: 12px; font-weight: 600; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field label { font-size: 11.5px; color: var(--fg-3); }
  .input { height: 30px; border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 0 9px; display: flex; align-items: center; justify-content: space-between; background: var(--surface); }
  .fmt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .fmt .btn { justify-content: center; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--border); border-radius: 6px; margin-top: 16px; }
  .kpi-row > div { padding: 10px 12px; border-left: 1px solid var(--border); }
  .kpi-row > div:first-child { border-left: 0; }
  .kpi-row .l { font-size: 10.5px; color: var(--fg-3); }
  .kpi-row .v { font-size: 17px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi-row .d { font-size: 11px; color: var(--fg-3); }
</style>
</head>
<body>
<script src="assets/app.js"></script>
<script>
const page = renderShell("Relatórios", {
  actions: `<span class="muted" style="font-size:12px">Guardado há 1 min</span><button class="btn">${icon("eye", 14)}Pré-visualizar</button><button class="btn primary">${icon("download", 14)}Exportar PDF</button>`,
});

const OUTLINE = [
  ["Resumo", [["Capa", 1], ["Resumo executivo", 1], ["Indicadores principais", 1], ["Objetivos e metas", 1], ["Orçamento e ritmo", 1]]],
  ["Google Ads", [["Visão geral e métricas", 1, true], ["Campanhas", 1], ["Competitividade na pesquisa", 1], ["Termos de pesquisa", 1], ["Palavras-chave e qualidade", 1], ["Dispositivos e redes", 1], ["Horários e dias", 0]]],
  ["Meta Ads", [["Visão geral e métricas", 1], ["Funil de conversão", 1], ["Campanhas e conjuntos", 1], ["Posicionamentos", 1], ["Idade e género", 1], ["Criativos", 1]]],
  ["Orgânico", [["SEO · Search Console", 1], ["Tráfego do site · GA4", 1], ["Conteúdo orgânico", 0]]],
  ["Conclusão", [["Recomendações aprovadas", 1], ["Próximos passos", 1], ["Metodologia e glossário", 1]]],
];
const total = OUTLINE.reduce((s, [, it]) => s + it.length, 0), on = OUTLINE.reduce((s, [, it]) => s + it.filter((i) => i[1]).length, 0);
const outline = OUTLINE.map(([g, items]) => `<h5>${g}<span>${items.filter((i) => i[1]).length}/${items.length}</span></h5>` +
  items.map(([n, inc, cur]) => `<div class="sec ${cur ? "on" : ""}"><span class="g">${icon("grip", 13)}</span>${n}<span class="tick ${inc ? "" : "off"}">${inc ? icon("check", 10, 'stroke-width="3"') : ""}</span></div>`).join("")).join("");

const row = (m, c, p, o = {}) => `<tr><td>${m}</td><td class="n strong">${c}</td><td class="n">${p}</td><td class="n">${o.d ?? ""}</td><td class="src">${o.s ?? ""}</td></tr>`;
const grp = (t) => `<tr class="grp"><td colspan="5">${t}</td></tr>`;
const D = (a, b, o) => deltaHtml(a, b, o);

const google = [
  grp("Investimento e tráfego"),
  row("Custo", "7 412 €", "7 050 €", { d: D(7412, 7050, { neutral: true }), s: "cost_micros" }),
  row("Impressões", "412 860", "389 120", { d: D(412860, 389120) }),
  row("Cliques", "18 940", "17 610", { d: D(18940, 17610) }),
  row("CTR", "4,59%", "4,53%", { d: D(0.0459, 0.0453, { unit: "pp" }), s: "cliques ÷ impressões" }),
  row("CPC médio", "0,39 €", "0,40 €", { d: D(0.39, 0.4, { invert: true }) }),
  row("CPM médio", "17,95 €", "18,12 €", { d: D(17.95, 18.12, { invert: true }) }),
  grp("Conversão"),
  row("Conversões", "702", "661", { d: D(702, 661), s: "ação principal" }),
  row("Taxa de conversão", "3,71%", "3,75%", { d: D(0.0371, 0.0375, { unit: "pp" }) }),
  row("Custo por conversão", "10,56 €", "10,67 €", { d: D(10.56, 10.67, { invert: true }) }),
  row("Valor de conversão", "52 340 €", "50 190 €", { d: D(52340, 50190) }),
  row("ROAS", "7,06×", "7,12×", { d: D(7.06, 7.12), s: "valor ÷ custo" }),
  row("Todas as conversões", "781", "742", { d: D(781, 742) }),
  row("Conversões pós-visualização", "96", "88", { d: D(96, 88) }),
  grp("Competitividade (Pesquisa e Shopping)"),
  row("Parcela de impressões", "64,2%", "66,0%", { d: D(0.642, 0.66, { unit: "pp" }) }),
  row("Perdida por orçamento", "12,8%", "10,1%", { d: D(0.128, 0.101, { unit: "pp", invert: true }) }),
  row("Perdida por classificação", "23,0%", "23,9%", { d: D(0.23, 0.239, { unit: "pp", invert: true }) }),
  row("Parcela no topo · topo absoluto", "48,1% · 27,4%", "47,2% · 26,8%", { d: D(0.481, 0.472, { unit: "pp" }) }),
  grp("Vídeo (YouTube e Demand Gen)"),
  row("Visualizações", "38 410", "31 200", { d: D(38410, 31200) }),
  row("Taxa de visualização", "21,6%", "20,4%", { d: D(0.216, 0.204, { unit: "pp" }) }),
  row("Custo por visualização", "0,014 €", "0,016 €", { d: D(0.014, 0.016, { invert: true }) }),
].join("");

const meta = [
  grp("Distribuição"),
  row("Valor gasto", "3 625 €", "3 574 €", { d: D(3625, 3574, { neutral: true }) }),
  row("Alcance", "186 200", "171 900", { d: D(186200, 171900), s: "deduplicado" }),
  row("Impressões", "512 400", "468 100", { d: D(512400, 468100) }),
  row("Frequência", "2,75", "2,72", { d: D(2.75, 2.72, { invert: true }) }),
  row("CPM", "7,07 €", "7,64 €", { d: D(7.07, 7.64, { invert: true }) }),
  grp("Tráfego"),
  row("Cliques no link · CTR", "6 140 · 1,20%", "5 880 · 1,26%", { d: D(6140, 5880) }),
  row("Cliques (todos) · CTR", "9 870 · 1,93%", "9 410 · 2,01%", { d: D(9870, 9410) }),
  row("CPC (link)", "0,59 €", "0,61 €", { d: D(0.59, 0.61, { invert: true }) }),
  row("Visualizações da página de destino", "4 810", "4 510", { d: D(4810, 4510), s: "Pixel / CAPI" }),
  grp("Conversão · atribuição 7 d clique, 1 d visualização"),
  row("Adições ao carrinho", "1 420", "1 362", { d: D(1420, 1362) }),
  row("Checkouts iniciados", "640", "655", { d: D(640, 655) }),
  row("Compras", "302", "305", { d: D(302, 305) }),
  row("Custo por compra", "12,00 €", "11,72 €", { d: D(12, 11.72, { invert: true }) }),
  row("Valor das compras · ROAS", "18 766 € · 5,18×", "18 120 € · 5,07×", { d: D(5.18, 5.07) }),
  row("Leads", '<span class="muted">Não disponível</span>', '<span class="muted">Não disponível</span>', { s: "sem campanhas de leads" }),
  grp("Criativo e vídeo"),
  row("Retenção inicial (reproduções 3 s ÷ impressões)", "32,0%", "34,8%", { d: D(0.32, 0.348, { unit: "pp" }) }),
  row("Retenção total (ThruPlays ÷ reproduções 3 s)", "23,2%", "22,9%", { d: D(0.232, 0.229, { unit: "pp" }) }),
  row("ThruPlays · custo por ThruPlay", "21 400 · 0,08 €", "19 800 · 0,09 €", { d: D(21400, 19800) }),
  row("Interações com publicação", "14 380", "13 050", { d: D(14380, 13050) }),
].join("");

const table = (rows) => `<table class="rt"><thead><tr><th>Métrica</th><th class="n">Set 2026</th><th class="n">Ago 2026</th><th class="n">Variação</th><th>Fonte / fórmula</th></tr></thead><tbody>${rows}</tbody></table>`;
const foot = (n) => `<div class="foot"><span>Loja Atlântico · Relatório mensal · setembro 2026 · DADOS SIMULADOS</span><span>Página ${n} de 14</span></div>`;

page.innerHTML = `
<div class="editor">
  <aside class="outline">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 8px"><b>Secções</b><span class="muted">${on} de ${total}</span></div>
    ${outline}
    <div style="padding:12px 8px 0"><button class="btn sm" style="width:100%;justify-content:center">${icon("plus", 13)}Secção de texto livre</button></div>
  </aside>

  <div class="canvas">
    <div class="sheet" style="min-height:1060px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="display:flex;gap:10px;align-items:center"><div class="c-avatar" style="width:28px;height:28px;font-size:11px">LA</div><div><b>Loja Atlântico</b><div class="muted" style="font-size:11px">Preparado por Marketing Hub · Diogo Pinto</div></div></div>
        <span class="pill sim">Contém dados simulados</span>
      </div>
      <div style="margin:36px 0 6px" class="muted">Relatório mensal de desempenho</div>
      <h1 style="font-size:24px;margin:0;letter-spacing:-0.02em">Setembro de 2026</h1>
      <div class="muted" style="margin-top:4px">1–30 set 2026 comparado com 2–31 ago 2026 · valores em EUR · fuso Europe/Lisbon</div>

      <h4>Resumo executivo</h4>
      <p>O investimento total subiu 3,9% para 11 037 €, com a receita atribuída a acompanhar (+2,7%, 71 106 €). O ROAS consolidado manteve-se em 6,44×, acima do objetivo de 5×. A Performance Max «Coleção Outono» foi a principal alavanca (ROAS 8,40×) e está limitada pelo orçamento. Na Meta, o custo por compra do público semelhante subiu 32% com frequência elevada; recomendamos renovar criativos antes de aumentar investimento.</p>

      <div class="kpi-row">
        <div><div class="l">Investimento</div><div class="v">11 037 €</div><div class="d">${D(11037, 10624, { neutral: true })} vs 10 624 €</div></div>
        <div><div class="l">Receita atribuída</div><div class="v">71 106 €</div><div class="d">${D(71106, 69260)} vs 69 260 €</div></div>
        <div><div class="l">ROAS</div><div class="v">6,44×</div><div class="d">${D(6.44, 6.52)} vs 6,52×</div></div>
        <div><div class="l">Conversões</div><div class="v">1 004</div><div class="d">${D(1004, 971)} vs 971</div></div>
      </div>

      <h4>Indicadores principais por canal</h4>
      <table class="rt"><thead><tr><th>Canal</th><th class="n">Investimento</th><th class="n">Conversões</th><th class="n">Custo/conv.</th><th class="n">Receita</th><th class="n">ROAS</th></tr></thead><tbody>
        <tr><td><span class="dot g"></span> Google Ads</td><td class="n">7 412 €</td><td class="n">702</td><td class="n">10,56 €</td><td class="n">52 340 €</td><td class="n strong">7,06×</td></tr>
        <tr><td><span class="dot m"></span> Meta Ads</td><td class="n">3 625 €</td><td class="n">302</td><td class="n">12,00 €</td><td class="n">18 766 €</td><td class="n strong">5,18×</td></tr>
        <tr><td><b>Total reportado</b></td><td class="n"><b>11 037 €</b></td><td class="n"><b>1 004</b></td><td class="n"><b>10,99 €</b></td><td class="n"><b>71 106 €</b></td><td class="n"><b>6,44×</b></td></tr>
      </tbody></table>
      <p style="font-size:11px;margin-top:6px" class="muted">Conversões e receitas são as reportadas por cada plataforma, com a respetiva atribuição. Podem existir conversões contadas por ambas.</p>

      <h4>Objetivos</h4>
      <table class="rt"><thead><tr><th>Objetivo</th><th class="n">Meta</th><th class="n">Resultado</th><th>Estado</th></tr></thead><tbody>
        <tr><td>ROAS por canal</td><td class="n">≥ 5,00×</td><td class="n">7,06× · 5,18×</td><td><span class="pill pos">Cumprido</span></td></tr>
        <tr><td>Custo por conversão</td><td class="n">≤ 11,00 €</td><td class="n">10,99 €</td><td><span class="pill pos">Cumprido</span></td></tr>
        <tr><td>Orçamento mensal</td><td class="n">10 500 €</td><td class="n">11 037 € (+5,1%)</td><td><span class="pill neg">Acima</span></td></tr>
      </tbody></table>
      ${foot(1)}
    </div>

    <div class="sheet" style="min-height:1060px;outline:2px solid var(--accent);outline-offset:3px">
      <div style="display:flex;align-items:center;gap:8px"><span class="dot g"></span><span class="muted">Google Ads · 4 contas</span></div>
      <h2>Visão geral e métricas</h2>
      <p>Todas as métricas disponíveis na Google Ads API para o período. Métricas de competitividade aplicam-se apenas a campanhas de Pesquisa e Shopping.</p>
      <div style="margin-top:14px">${comboChart({ labels: DAYS.map(dayLbl), bars: [{ values: series(31, 30, 247, 0.2, 0.1), color: "var(--google)" }], line: { values: series(32, 30, 23.4, 0.3, 0.1), color: "var(--fg)" }, h: 150, yFmt: (v) => eur(v), y2Fmt: (v) => num(v) })}
      <div class="caption">Custo diário (€, barras) e conversões (linha, eixo dir.) · 1–30 set 2026</div></div>
      <div style="margin-top:12px">${table(google)}</div>
      ${foot(4)}
    </div>

    <div class="sheet" style="min-height:1060px">
      <div style="display:flex;align-items:center;gap:8px"><span class="dot m"></span><span class="muted">Meta Ads · act_…4821</span></div>
      <h2>Visão geral e métricas</h2>
      <p>Métricas da Meta Marketing API. O alcance é deduplicado no período e não deve ser somado entre campanhas ou dias.</p>
      <div style="margin-top:12px">${table(meta)}</div>
      ${foot(8)}
    </div>
  </div>

  <aside class="settings">
    <div class="set-b">
      <h5>Relatório</h5>
      <div class="field"><label>Modelo</label><div class="input">Mensal completo${icon("chevDown", 13)}</div></div>
      <div class="field"><label>Período</label><div class="input">1 – 30 set 2026${icon("calendar", 13)}</div></div>
      <div class="field"><label>Comparação</label><div class="seg" style="width:100%"><button class="on" style="flex:1">Período anterior</button><button style="flex:1">Ano anterior</button></div></div>
      <div class="field" style="margin-bottom:0"><label>Idioma e moeda</label><div class="input">Português (PT) · EUR${icon("chevDown", 13)}</div></div>
    </div>
    <div class="set-b">
      <h5>Exportar</h5>
      <div class="fmt"><button class="btn sm">PDF</button><button class="btn sm">Excel</button><button class="btn sm">CSV</button></div>
      <div class="caption">Excel e CSV incluem uma folha por secção com todas as métricas.</div>
    </div>
    <div class="set-b">
      <h5>Partilhar</h5>
      <div class="input" style="font-size:12px"><span class="mono muted">…/share/k3J9·····</span><span class="pill">Expira 14 nov</span></div>
      <div style="display:flex;gap:6px;margin-top:8px"><button class="btn sm">${icon("link", 13)}Copiar link</button><button class="btn sm ghost">Revogar</button></div>
    </div>
    <div class="set-b">
      <h5>Agendamento</h5>
      <div style="display:flex;justify-content:space-between;align-items:center"><span>Todos os meses, dia 2 às 09:00</span><span class="pill pos">Ativo</span></div>
      <div class="caption" style="margin-top:4px">Próximo envio: 2 nov 2026 · 2 destinatários</div>
    </div>
    <div class="set-b" style="border-bottom:0">
      <h5>Envios</h5>
      <div class="list" style="margin:0 -16px">
        <div class="li" style="padding:8px 16px"><div><div>marketing@lojaatlantico.pt</div><div class="s">2 out · 09:00</div></div><span class="pill sim" style="margin-left:auto">Não enviado · SMTP não configurado</span></div>
        <div class="li" style="padding:8px 16px"><div><div>diogo@agencia.pt</div><div class="s">2 out · 09:00</div></div><span class="pill sim" style="margin-left:auto">Não enviado · SMTP não configurado</span></div>
      </div>
    </div>
  </aside>
</div>`;
</script>
</body>
</html>
