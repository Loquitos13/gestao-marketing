name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  APP_URL: http://localhost:3100
  DATABASE_URL: postgresql://mih:mih_ci_password@localhost:5432/mih
  REDIS_URL: redis://localhost:6379
  # Valores apenas para CI; nenhum segredo real.
  ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  SESSION_SECRET: ci-only-session-secret-with-enough-length-000
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: CiPassword2026
  SEED_DEMO: "true"
  LOG_LEVEL: warn

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mih
          POSTGRES_PASSWORD: mih_ci_password
          POSTGRES_DB: mih
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mih -d mih" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
      - name: Testes e2e
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          NODE_ENV: production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app
        uses: docker/build-push-action@v6
        with: { context: ., target: app, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Build worker
        uses: docker/build-push-action@v6
        with: { context: ., target: worker, push: false, cache-from: type=gha }
